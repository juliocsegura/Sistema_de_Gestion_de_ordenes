{% for orden in pendientes %}
<div class="sap-card bg-gray-800 hover:bg-gray-750 border border-gray-600 hover:border-blue-500 rounded-lg p-3 transition group relative animate-fade-in">
    
    <div class="flex justify-between items-start mb-2">
        <div>
            <span class="text-xs font-bold text-gray-500">SAP:</span>
            <span class="text-lg font-bold text-white leading-none">{{ orden.order }}</span>
        </div>
        
        {% with estatus=orden.estatus_descripcion|upper %}
        <span class="text-[9px] font-bold px-2 py-0.5 rounded border 
            {% if 'ABIERTA' in estatus %} bg-green-900/50 text-green-400 border-green-700
            {% elif 'CERRADA' in estatus %} bg-red-900/50 text-red-400 border-red-700
            {% elif 'MAL' in estatus or 'INCOMPLETO' in estatus %} bg-orange-900/50 text-orange-400 border-orange-700
            {% else %} bg-gray-700 text-gray-300 border-gray-500 {% endif %}">
            {{ estatus }}
        </span>
        {% endwith %}
    </div>

    <div class="flex justify-between items-end">
        <div class="flex-1 pr-2">
            <div class="flex items-center gap-1 mb-1">
                <span class="text-xs text-blue-300 font-mono bg-blue-900/30 px-1.5 rounded border border-blue-800">
                    {{ orden.work_center|default:"Sin Molde" }}
                </span>
            </div>
            <div class="text-[10px] text-gray-400 leading-tight truncate" title="{{ orden.description }}">
                {{ orden.description|default:"Sin descripción" }}
            </div>
        </div>

        <button onclick="abrirModalAsignar('{{ orden.order }}', '{{ orden.description|escapejs }}', '{{ orden.work_center|default:'' }}')" 
                class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-1.5 px-3 rounded shadow transition transform group-hover:scale-105 flex items-center gap-1 shrink-0">
            Asignar <span class="text-lg leading-none">&rsaquo;</span>
        </button>
    </div>
</div>
{% empty %}
<div class="flex flex-col items-center justify-center py-12 text-gray-500 opacity-50">
    <svg class="w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
    <span class="text-sm italic">Sin órdenes pendientes</span>
</div>
{% endfor %}
